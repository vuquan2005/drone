# Attach to a running STM32F103VET6. No flash, reset, halt, or breakpoint.
bindto 127.0.0.1
if { [catch {gdb port disabled}] } { gdb_port disabled }
if { [catch {tcl port disabled}] } { tcl_port disabled }
if { [catch {telnet port disabled}] } { telnet_port disabled }

source [find interface/stlink.cfg]
# OpenOCD 0.12 builds may provide either the HLA or the direct ST-LINK driver.
if { [adapter name] eq "hla" } {
    transport select hla_swd
} else {
    if { [lsearch -exact [transport list] swd] >= 0 } {
        transport select swd
    } else {
        transport select dapdirect_swd
    }
}
adapter speed 1000
source [find target/stm32f1x.cfg]
reset_config none

init
# STM32F103VE: scan its 64 KiB SRAM; no ELF symbol address is needed.
rtt setup 0x20000000 0x10000 "SEGGER RTT"
rtt polling_interval 20
rtt start
rtt server start 9090 0
rtt server start 9091 1
echo "RTT channel 0: connect a raw TCP client to 127.0.0.1:9090"
echo "RTT channel 1 (data): 127.0.0.1:9091"
