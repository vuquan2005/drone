[project]
name = "drone-tools"
version = "0.1.0"
description = "Host tools for STM32 drone development"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pre-commit>=4,<5"]
rtt = [
    "PySide6-Essentials>=6.6,<7",
    "pyqtgraph>=0.13.7,<0.15",
    "numpy>=1.25,<3",
]
cad = [
    "build123d>=0.13,<0.14",
    "ipykernel>=7,<8",  # Run the demo's # %% cells in VS Code.
    "ocp-vscode>=4.2,<5",
]

[tool.uv]
package = false

[tool.uv.dependency-groups]
cad = { requires-python = ">=3.11,<3.15" }

[tool.black]
line-length = 100
target-version = ["py310"]
