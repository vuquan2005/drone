[project]
name = "drone-tools"
version = "0.1.0"
description = "Host tools for STM32 drone development"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pre-commit>=4,<5"]
rtt = [
    "PySide6-Essentials>=6.6,<7",
    "pyqtgraph>=0.13.7,<0.15",
    "numpy>=1.25,<3",
]

[tool.uv]
package = false

[tool.black]
line-length = 100
target-version = ["py310"]
